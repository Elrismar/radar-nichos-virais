
name: Radar de Nichos Virais - Pesquisa manual

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Tema opcional para pesquisar no YouTube'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: radar-manual
  cancel-in-progress: false

jobs:
  scan:
    name: Executar varredura manual
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar sintaxe e dados antes da coleta
        run: |
          python -m py_compile scanner.py
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          if "\nload();" not in script:
              raise SystemExit("Não foi possível localizar a inicialização do painel.")
          script = script.rsplit("\nload();", 1)[0]
          script = "globalThis.document = { getElementById: () => ({ addEventListener() {} }) };" + chr(10) + script
          script += """
          if (!matchesSearch("Fórmula 1 vídeos incríveis", "formula")) throw new Error("Busca sem acento falhou");
          if (!matchesSearch("Curiosidades científicas", "curiosidaddes")) throw new Error("Busca com erro de digitação falhou");
          if (matchesSearch("Uma festa no canal", "art")) throw new Error("Busca curta gerou falso positivo");
          if (durationSeconds("PT3M") !== 180) throw new Error("Duração de Shorts não reconhecida");
          if (durationSeconds("PT1H2M3S") !== 3723) throw new Error("Duração longa incorreta");
          console.log("Testes de busca do painel aprovados.");
          """
          Path("/tmp/radar-inline.js").write_text(script, encoding="utf-8")
          for name in ("data/results.json", "data/history.json", "data/tracked.json", "data/run.json"):
              path = Path(name)
              if path.exists():
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          node --check /tmp/radar-inline.js
          node /tmp/radar-inline.js
          python - <<'PY'
          import scanner
          assert scanner.duration_seconds("PT3M") == 180
          assert scanner.duration_seconds("PT3M1S") == 181
          assert scanner.duration_seconds("PT1H2M3S") == 3723
          assert scanner.duration_seconds("") == 0
          pool = scanner.build_search_pool()
          assert len(pool) == len(set(pool)), "Combinações duplicadas na rotação"
          batch = pool[:scanner.SEARCH_CALLS_MAX]
          assert len({query for query, _, _ in batch}) == len(batch), "Lote não cobre temas diversos"
          assert len({region for _, _, region in batch}) > 1, "Lote concentrado em uma região"
          print(f"Validação OK: {len(pool)} combinações únicas; lote diversificado.")
          PY

      - name: Pesquisar nichos e vídeos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CUSTOM_QUERY: ${{ inputs.search_query }}
        run: python scanner.py

      - name: Salvar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Atualiza resultados da pesquisa manual" && git push)
          
